<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>qualbyy@shell: ~</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f2eb;
      --term-bg: #fcfbf9;
      --header-bg: #ece6da;
      --border: #dfd7c8;
      --border-dark: #cec2ae;
      --text: #2f2a24;
      --text-dim: #7a7164;
      
      --sand-accent: #a07844;
      --sand-dark: #825e2e;
      --sand-badge: #eee7db;
      --prompt-user: #8c6838;
      --prompt-path: #6b6357;
      
      --font-mono: "Golos Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 1.55;
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* Окна внутри рабочего стола */
      text-transform: lowercase;
      position: relative;
    }

    /* Окна ОС (абсолютное позиционирование с возможностью перетаскивания) */
    .window {
      position: absolute;
      background: var(--term-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 12px 36px rgba(130, 94, 46, 0.12), 0 3px 8px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform-origin: 100% 50%;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease, filter 0.3s ease;
      will-change: transform, opacity, left, top;
      max-height: 88vh;
    }

    .window.active-focus {
      z-index: 100 !important;
      box-shadow: 0 18px 48px rgba(130, 94, 46, 0.18), 0 4px 12px rgba(0, 0, 0, 0.06);
      border-color: var(--border-dark);
    }

    /* Genie Effect сворачивания к правому доку */
    .window.minimized {
      transform: translate3d(320px, 0, -200px) scale(0.04, 0.2) skewY(6deg);
      opacity: 0;
      pointer-events: none;
      filter: blur(4px);
    }

    /* Эффект выключения старого ТВ при закрытии (CRT TV off) */
    .window.tv-closing {
      animation: crtTvOff 0.38s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      pointer-events: none;
    }

    @keyframes crtTvOff {
      0% {
        transform: scale(1, 1);
        filter: brightness(1);
        opacity: 1;
      }
      40% {
        transform: scale(1.04, 0.008);
        filter: brightness(1.8) contrast(1.5);
        opacity: 0.95;
      }
      75% {
        transform: scale(0.15, 0.008);
        filter: brightness(2.5);
        opacity: 0.8;
      }
      100% {
        transform: scale(0, 0);
        filter: brightness(3);
        opacity: 0;
      }
    }

    .window-main {
      width: 700px;
      max-width: 92vw;
    }

    .window-blog {
      width: 520px;
      max-width: 90vw;
    }

    .window-modal {
      width: 480px;
      max-width: 90vw;
      background: var(--term-bg);
      border: 1px solid var(--border-dark);
      z-index: 150 !important;
    }

    .modal-game-content {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      color: var(--text);
    }

    /* Шапка окна (draggable хэндл) */
    .window-header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      padding: 6px 14px 6px 6px; /* смещаем область кнопок левее */
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      cursor: grab;
      min-height: 38px;
    }

    .window-header:active {
      cursor: grabbing;
    }

    .header-buttons {
      display: flex;
      gap: 0px;
      align-items: center;
      margin-left: 2px;
    }

    /* Декоративные кнопки заголовка окна */
    .btn-hitbox {
      width: 19px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }

    .btn {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
      pointer-events: none;
      transition: transform 0.1s ease;
    }

    .btn-close { background: #dca394; }
    .btn-min { background: #e0cb8f; }
    .btn-max { background: #abc699; }

    .header-title {
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 0.04em;
      pointer-events: none;
    }

    .header-title span.full-title {
      display: inline;
    }

    .terminal-content {
      position: relative;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      max-height: calc(88vh - 42px);
    }

    .terminal-watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
      max-width: 60%;
      max-height: 60%;
      pointer-events: none;
      opacity: 0.045;
      user-select: none;
      z-index: 0;
      color: var(--sand-dark);
    }

    .line {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .prompt-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }

    .prompt {
      display: inline-flex;
      gap: 4px;
      font-weight: 600;
      user-select: none;
    }

    .p-user { color: var(--prompt-user); }
    .p-path { color: var(--prompt-path); }
    .p-sym { color: var(--text-dim); }

    .command {
      color: var(--sand-dark);
      font-weight: 600;
    }

    .dim { color: var(--text-dim); }

    /* Fastfetch */
    .fetch-container {
      display: flex;
      gap: 18px;
      align-items: flex-start;
      margin-top: 4px;
    }

    @media (max-width: 580px) {
      .fetch-container {
        flex-direction: column;
        gap: 12px;
      }
    }

    .fetch-logo {
      color: var(--sand-accent);
      width: 140px;
      height: 128px;
      flex-shrink: 0;
      user-select: none;
      filter: drop-shadow(0 2px 6px rgba(160, 120, 68, 0.15));
      transition: transform 0.25s ease, color 0.25s ease;
    }

    .fetch-logo:hover {
      transform: scale(1.04) rotate(-1deg);
      color: var(--sand-dark);
    }

    .fetch-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }

    .fetch-title {
      font-weight: 700;
      color: var(--sand-dark);
      margin-bottom: 2px;
    }

    .fetch-sep {
      color: var(--border-dark);
      font-size: 12px;
      margin-bottom: 4px;
      user-select: none;
    }

    .fetch-row {
      display: flex;
      gap: 8px;
    }

    .f-key {
      color: var(--sand-accent);
      font-weight: 600;
      min-width: 75px;
      flex-shrink: 0;
    }

    .f-val {
      color: var(--text);
    }

    /* Кнопки */
    .quick-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .nav-btn {
      background: var(--sand-badge);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      background: #e4dcce;
      border-color: var(--border-dark);
      color: var(--sand-dark);
    }

    .nav-btn.nav-btn-highlight {
      background: #f7e6e5;
      border-color: #e5b8b5;
      color: #9c433d;
    }

    .nav-btn.nav-btn-highlight:hover {
      background: #f0d5d4;
      border-color: #d69894;
      color: #7d2e29;
    }

    .nav-btn.nav-btn-purple {
      background: #f3e8f8;
      border-color: #dfc2ea;
      color: #7c3a92;
    }

    .nav-btn.nav-btn-purple:hover {
      background: #ebd4f2;
      border-color: #cf9fe0;
      color: #632a76;
    }

    .nav-btn.nav-btn-sky {
      background: #e6f4fa;
      border-color: #bde0f0;
      color: #1e6d92;
    }

    .nav-btn.nav-btn-sky:hover {
      background: #d4ecf7;
      border-color: #9eccdf;
      color: #134e6b;
    }

    /* Таблицы */
    .table-view {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .table-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 4px;
    }

    .table-key {
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .table-val {
      text-align: right;
      color: var(--text);
    }

    a.term-link {
      color: var(--sand-dark);
      text-decoration: none;
      border-bottom: 1px dotted var(--sand-accent);
      font-weight: 500;
    }

    a.term-link:hover {
      border-bottom-style: solid;
      color: #5c3f19;
    }

    .copyable {
      cursor: pointer;
    }

    .copyable:hover .table-key {
      color: var(--sand-dark);
    }

    .copy-hint {
      font-size: 11px;
      color: var(--sand-accent);
      margin-left: 6px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .copyable:hover .copy-hint {
      opacity: 0.7;
    }

    .copied-toast {
      color: #6a8c4f !important;
      opacity: 1 !important;
      font-weight: 600;
    }

    .tag-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .term-tag {
      background: var(--sand-badge);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--text);
    }

    .term-tag.interactive-tag {
      cursor: pointer;
      border-color: var(--border-dark);
      background: #f1ebdE;
      color: var(--sand-dark);
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .term-tag.interactive-tag:hover {
      background: #e6ddcc;
      border-color: var(--sand-accent);
      transform: translateY(-1px);
    }

    .dni-tag {
      color: var(--text-dim);
      border-color: #e5ded3;
      background: #f4eee3;
    }

    /* Строка ввода */
    .interactive-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      background: #f5f0e6;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
    }

    .cmd-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--sand-dark);
      font-family: var(--font-mono);
      font-size: 13.5px;
      width: 100%;
      text-transform: lowercase;
    }

    .cursor {
      display: inline-block;
      width: 7px;
      height: 14px;
      background: var(--sand-dark);
      vertical-align: middle;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Блог-карточки */
    .blog-post-card {
      background: #f8f6f0;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .blog-post-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 11.5px;
      color: var(--text-dim);
      border-bottom: 1px dashed var(--border);
      padding-bottom: 4px;
    }

    .blog-post-title {
      font-weight: 700;
      color: var(--sand-dark);
      font-size: 13px;
    }

    .blog-post-text {
      color: var(--text);
      white-space: pre-wrap;
      line-height: 1.5;
    }



    /* МОБИЛЬНАЯ АДАПТАЦИЯ (под точный масштаб экрана мобильных) */
    @media (max-width: 768px) {
      body {
        padding: 0 !important;
        margin: 0 !important;
        width: 100vw !important;
        height: 100dvh !important;
        height: 100vh;
        overflow: hidden !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: flex-start !important;
      }

      .window-main, .window-blog {
        position: absolute !important;
        width: calc(100vw - 16px) !important;
        max-width: calc(100vw - 16px) !important;
        left: 8px !important;
        top: 8px !important;
        height: calc(100dvh - 16px) !important;
        height: calc(100vh - 16px) !important;
        max-height: calc(100dvh - 16px) !important;
        transform-origin: 50% 100%;
        margin: 0 !important;
        transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.28s ease !important;
      }

      .window-main.minimized, .window-blog.minimized {
        transform: translate3d(0, 120px, 0) scale(0.65) !important;
        opacity: 0 !important;
        pointer-events: none !important;
        filter: blur(3px) !important;
        display: flex !important;
      }

      /* Окно с информацией об игре: плавная модальная анимация появления из центра */
      .window-modal {
        position: fixed !important;
        width: calc(100vw - 28px) !important;
        max-width: 440px !important;
        left: 50% !important;
        top: 50% !important;
        transform: translate(-50%, -50%) scale(1) !important;
        height: auto !important;
        max-height: 80vh !important;
        z-index: 10000 !important;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35) !important;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease !important;
      }

      .window-modal.minimized {
        transform: translate(-50%, -40%) scale(0.85) !important;
        opacity: 0 !important;
        pointer-events: none !important;
        display: flex !important;
      }

      .window-header {
        cursor: default;
        min-height: 34px;
        padding: 4px 10px;
        flex-shrink: 0;
      }

      .window.minimized {
        transform: translate3d(0, 150px, -80px) scale(0.2, 0.04);
        opacity: 0;
        filter: blur(4px);
        pointer-events: none;
        display: none !important; /* На мобилке скрываем полностью чтобы не мешало */
      }

      /* Центрирование и укорачивание заголовка окна блога на мобилке */
      #win-blog .window-header {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      #win-blog .header-title::after {
        content: "microblog";
      }

      #win-blog .header-title span.full-title {
        display: none;
      }

      #win-blog .header-title {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        width: auto;
      }

      .nav-btn {
        padding: 4px 8px;
        font-size: 11.5px;
      }

      .terminal-content {
        padding: 12px 10px;
        flex: 1 1 auto;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch;
      }

      .fetch-logo {
        width: 105px;
        height: 96px;
      }

      .fetch-container {
        gap: 8px;
      }

      .interactive-line {
        padding: 6px 8px;
        margin-top: 6px;
      }

      .cmd-input {
        font-size: 13px;
      }
    }


  </style>
</head>

      <div style="width: 58px;"></div>

  <script src="data.js"></script>

  <script>
    // Z-index счетчик для активного окна
    let highestZ = 10;
    function bringToFront(winId) {
      highestZ += 2;
      const el = document.getElementById('win-' + winId);
      el.style.zIndex = highestZ;
      document.querySelectorAll('.window').forEach(w => w.classList.remove('active-focus'));
      el.classList.add('active-focus');
    }

    // Открытие окна достижений игры (нативный стиль био)
    function openGameModal(key) {
      const modal = document.getElementById('win-game-modal');
      const titleEl = document.getElementById('game-modal-title');
      const bodyEl = document.getElementById('game-modal-body');

      const game = BIO_DATA.games.find(g => typeof g === 'object' && g.key === key);
      if (!game) return;

      titleEl.innerText = `${game.title} — stats`;
      bodyEl.innerHTML = `
        <div class="line">
          <div class="prompt-row">
            <span class="prompt"><span class="p-user">qualbyy</span><span class="p-sym">:</span><span class="p-path">~/games</span><span class="p-sym">$</span></span>
            <span class="command">stat ./${game.key}.conf</span>
          </div>
          <div class="table-view" style="margin-top: 6px;">
            <div class="table-row">
              <span class="table-key">никнейм</span>
              <span class="table-val" style="font-weight: 600; color: var(--sand-dark);">${game.ign}</span>
            </div>
            ${game.details.map(d => `
              <div class="table-row">
                <span class="table-key">${d.label}</span>
                <span class="table-val">${d.val}</span>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="dim" style="font-size: 11px; margin-top: 4px; border-top: 1px dashed var(--border); padding-top: 8px; display: flex; justify-content: space-between; align-items: center;">
          <span>status: sync completed &bull; verified profile</span>
          <span style="cursor: pointer; color: var(--sand-dark);" onclick="closeWindowWithTvEffect('game-modal')">[закрыть]</span>
        </div>
      `;

      windowState['game-modal'] = true;
      modal.classList.remove('minimized');
      modal.classList.remove('tv-closing');
      if (!isMobile()) {
        centerWindow('game-modal');
      }
      bringToFront('game-modal');
    }

    // Состояния окон
    const windowState = {
      term: true,
      blog: false
    };

    // Центрирование окон по умолчанию
    function centerWindow(winId) {
      const el = document.getElementById('win-' + winId);
      // Учитываем реальный bounding rect окна
      const rect = el.getBoundingClientRect();
      const w = rect.width || (winId === 'term' ? 700 : 520);
      const h = rect.height || el.offsetHeight || 520;
      
      const left = Math.max(10, Math.round((window.innerWidth - w) / 2));
      const top = Math.max(10, Math.round((window.innerHeight - h) / 2));

      el.style.left = left + 'px';
      el.style.top = top + 'px';
    }

    function closeWindowWithTvEffect(winId) {
      const winEl = document.getElementById('win-' + winId);
      const dockEl = document.getElementById('dock-' + winId);
      
      winEl.classList.remove('minimized');
      winEl.classList.add('tv-closing');
      windowState[winId] = false;
      if (dockEl) dockEl.classList.remove('open');

      setTimeout(() => {
        winEl.classList.remove('tv-closing');
        winEl.classList.add('minimized');
      }, 380);
    }

    function isMobile() {
      return window.innerWidth <= 768;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && windowState['game-modal']) {
        closeWindowWithTvEffect('game-modal');
      }
    });

    // ЛОГИКА DRAGGABLE ПЕРЕТАСКИВАНИЯ ОКОН
    let activeDragWin = null;
    let dragStartX = 0, dragStartY = 0;
    let initialWinX = 0, initialWinY = 0;

    function startDrag(e, elementId) {
      if (isMobile()) return; // на смартфонах окна зафиксированы, без перетаскивания
      if (e.target.classList.contains('btn')) return;
      activeDragWin = document.getElementById(elementId);
      bringToFront(elementId.replace('win-', ''));

      dragStartX = e.clientX;
      dragStartY = e.clientY;

      initialWinX = activeDragWin.offsetLeft;
      initialWinY = activeDragWin.offsetTop;

      document.addEventListener('mousemove', onDragMove);
      document.addEventListener('mouseup', endDrag);
      e.preventDefault();
    }

    function onDragMove(e) {
      if (!activeDragWin) return;
      const deltaX = e.clientX - dragStartX;
      const deltaY = e.clientY - dragStartY;

      let newX = initialWinX + deltaX;
      let newY = initialWinY + deltaY;

      // Ограничения краев экрана
      newX = Math.max(10, Math.min(window.innerWidth - activeDragWin.offsetWidth - 60, newX));
      newY = Math.max(10, Math.min(window.innerHeight - 80, newY));

      activeDragWin.style.left = newX + 'px';
      activeDragWin.style.top = newY + 'px';
    }

    function endDrag() {
      activeDragWin = null;
      document.removeEventListener('mousemove', onDragMove);
      document.removeEventListener('mouseup', endDrag);
    }

    // Рендер постов блога
    function renderBlogPosts() {
      const container = document.getElementById('blog-posts-view');
      const posts = (typeof BIO_DATA.posts !== 'undefined' && BIO_DATA.posts.length > 0)
        ? BIO_DATA.posts
        : [];

      if (posts.length === 0) {
        container.innerHTML = '<div class="dim" style="padding: 10px 0;">заметок пока нет.</div>';
      } else {
        container.innerHTML = posts.map(p => `
          <div class="blog-post-card">
            <div class="blog-post-meta">
              <span class="blog-post-title">${p.title}</span>
              <span>${p.date}</span>
            </div>
            <div class="blog-post-text">${p.text}</div>
          </div>
        `).join('');
      }
    }

    // Рендер fastfetch
    function renderFetch() {
      const container = document.getElementById('fetch-info-block');
      container.innerHTML = `
        <div class="fetch-title">${BIO_DATA.user}@shell</div>
        <div class="fetch-sep">-----------------------------</div>
        <div class="fetch-row"><span class="f-key">name</span><span class="f-val">${BIO_DATA.name}</span></div>
        <div class="fetch-row"><span class="f-key">years</span><span class="f-val">${BIO_DATA.years}</span></div>
        <div class="fetch-row"><span class="f-key">location</span><span class="f-val">${BIO_DATA.location}</span></div>
        <div class="fetch-row"><span class="f-key">theme</span><span class="f-val">sand paper</span></div>
        <div class="fetch-row"><span class="f-key">type</span><span class="f-val">infp</span></div>
        <div class="fetch-row" style="margin-top: 4px;"><span class="f-key">status</span><span class="f-val">${BIO_DATA.status}</span></div>
      `;
    }

    // Копирование ников
    function copyText(val, el) {
      navigator.clipboard.writeText(val);
      const hint = el.querySelector('.copy-hint');
      if (hint) {
        const oldText = hint.innerText;
        hint.innerText = '[скопировано!]';
        hint.classList.add('copied-toast');
        setTimeout(() => {
          hint.innerText = oldText;
          hint.classList.remove('copied-toast');
        }, 1800);
      }
    }

    // HTML секций
    function getSectionHtml(cmd) {

        case 'project':

            <div class="output">
              <div style="margin-bottom: 6px;">мой сайт для удобного просмотра информации по сходкам ГДшеров из Москвы</div>
              <div><a class="term-link" href="https://qualbyy.github.io/mskmeetsgmd" target="_blank">qualbyy.github.io/mskmeetsgmd &nearr;</a></div>
            </div>
          `;
        case 'qplate':
          return `
            <div class="prompt-row">
              <span class="prompt"><span class="p-user">qualbyy</span><span class="p-sym">:</span><span class="p-path">~</span><span class="p-sym">$</span></span>
              <span class="command">cat ./qplate.txt</span>

            <div class="output">
              <div style="margin-bottom: 6px;">мой конструктор сайтов, похожий на этот</div>

            </div>
          `;
        case 'qsak':
          return `
            <div class="prompt-row">
              <span class="prompt"><span class="p-user">qualbyy</span><span class="p-sym">:</span><span class="p-path">~</span><span class="p-sym">$</span></span>
              <span class="command">cat ./qsak.txt</span>
            </div>
            <div class="output">
              <div style="margin-bottom: 6px;">швейцарский нож для всех форматов</div>
              <div><a class="term-link" href="https://qualbyy.github.io/qsak" target="_blank">qualbyy.github.io/qsak &nearr;</a></div>
            </div>
          `;
        case 'blog':
          return `
            <div class="prompt-row">
              <span class="prompt"><span class="p-user">qualbyy</span><span class="p-sym">:</span><span class="p-path">~</span><span class="p-sym">$</span></span>
              <span class="command">cat ./blog.txt</span>
            </div>
            <div class="output">
              <div style="margin-bottom: 6px;">мой личный блог в телеграме</div>
              <div><a class="term-link" href="https://t.me/qualbyy" target="_blank">t.me/qualbyy &nearr;</a></div>
            </div>
          `;
        case 'about':
          return `
            <div class="prompt-row">
              <span class="prompt"><span class="p-user">qualbyy</span><span class="p-sym">:</span><span class="p-path">~</span><span class="p-sym">$</span></span>
              <span class="command">cat about.txt</span>
            </div>
            <div class="output">${BIO_DATA.about}</div>
          `;
        case 'stack':
          return `
            <div class="prompt-row">
              <span class="prompt"><span class="p-user">qualbyy</span><span class="p-sym">:</span><span class="p-path">~</span><span class="p-sym">$</span></span>
              <span class="command">cat ./tech_stack.md</span>
            </div>
            <div class="output table-view">
              ${BIO_DATA.stack.map(s => `
                <div class="table-row">
                  <span class="table-key">${s.cat}</span>
                  <span class="table-val">
                    ${s.url ? `<a class="term-link" href="${s.url}" target="_blank">${s.list}</a>` : s.list}
                  </span>
                </div>
              `).join('')}
            </div>
          `;
        case 'telegram':
          return `
            <div class="prompt-row">
              <span class="prompt"><span class="p-user">qualbyy</span><span class="p-sym">:</span><span class="p-path">~</span><span class="p-sym">$</span></span>
              <span class="command">ls -la ./telegram/</span>
            </div>
            <div class="output table-view">
              ${BIO_DATA.telegram.map(item => `
                <div class="table-row">
                  <span><a class="term-link" href="${item.url}" target="_blank">${item.tag}</a></span>
                  <span class="dim">${item.desc}</span>
                </div>
              `).join('')}
            </div>
          `;
        case 'accounts':
          return `
            <div class="prompt-row">
              <span class="prompt"><span class="p-user">qualbyy</span><span class="p-sym">:</span><span class="p-path">~</span><span class="p-sym">$</span></span>
              <span class="command">cat ./accounts.conf</span>
              <span class="dim">(кликни на строку, чтобы скопировать)</span>
            </div>
            <div class="output table-view">
              ${BIO_DATA.accounts.map(acc => `
                <div class="table-row copyable" onclick="copyText('${acc.value}', this)">
                  <span class="table-key">${acc.platform}</span>
                  <span class="table-val">
                    ${acc.url ? `<a class="term-link" href="${acc.url}" target="_blank" onclick="event.stopPropagation()">${acc.value}</a>` : acc.value}
                    <span class="copy-hint">[копировать]</span>
                  </span>
                </div>
              `).join('')}
            </div>
          `;
        case 'setup':
          return `
            <div class="prompt-row">
              <span class="prompt"><span class="p-user">qualbyy</span><span class="p-sym">:</span><span class="p-path">~</span><span class="p-sym">$</span></span>
              <span class="command">inxi --hardware</span>
            </div>
            <div class="output table-view">
              ${BIO_DATA.setup.map(s => `
                <div class="table-row">
                  <span class="table-key">${s.key}</span>
                  <span class="table-val">${s.val}</span>
                </div>
              `).join('')}
            </div>
          `;
        case 'games':
          return `
            <div class="prompt-row">
              <span class="prompt"><span class="p-user">qualbyy</span><span class="p-sym">:</span><span class="p-path">~</span><span class="p-sym">$</span></span>
              <span class="command">cat ./games.list</span>
              <span class="dim">(нажми на игру со стрелкой &nearr; чтобы открыть информацию)</span>
            </div>
            <div class="output tag-grid">
              ${BIO_DATA.games.map(g => {
                if (typeof g === 'object' && g.key) {
                  return `<span class="term-tag interactive-tag" onclick="openGameModal('${g.key}')">${g.title} &nearr;</span>`;
                }
                const title = typeof g === 'object' ? g.title : g;
                return `<span class="term-tag">${title}</span>`;
              }).join('')}
            </div>
          `;
        case 'traits':
          return `
            <div class="prompt-row">
              <span class="prompt"><span class="p-user">qualbyy</span><span class="p-sym">:</span><span class="p-path">~</span><span class="p-sym">$</span></span>
              <span class="command">cat ./traits.txt</span>
            </div>
            <div class="output tag-grid">
              ${BIO_DATA.traits.map(t => `<span class="term-tag">${t}</span>`).join('')}
            </div>
          `;
        case 'dni':
          return `
            <div class="prompt-row">
              <span class="prompt"><span class="p-user">qualbyy</span><span class="p-sym">:</span><span class="p-path">~</span><span class="p-sym">$</span></span>
              <span class="command">iptables -L drop</span>
            </div>
            <div class="output tag-grid">
              ${BIO_DATA.dni.map(d => `<span class="term-tag dni-tag">${d}</span>`).join('')}
            </div>
          `;
        default:
          return null;
      }
    }

    function runCmd(cmd) {
      const clean = cmd.trim().toLowerCase();
      if (!clean) return;

      const out = document.getElementById('dynamic-output');

      if (clean === 'clear') {
        out.innerHTML = '';
        return;
      }

      if (clean === 'all') {
        ['about', 'stack', 'telegram', 'accounts', 'setup', 'games', 'traits', 'dni'].forEach(c => {
          const div = document.createElement('div');
          div.className = 'line';
          div.innerHTML = getSectionHtml(c);
          out.appendChild(div);
        });
        const foot = document.createElement('div');
        foot.className = 'line';
        foot.innerHTML = `
          <div class="prompt-row">
            <span class="prompt"><span class="p-user">qualbyy</span><span class="p-sym">:</span><span class="p-path">~</span><span class="p-sym">$</span></span>
            <span class="dim">echo "${BIO_DATA.footer}"</span>
            <span class="cursor"></span>
          </div>
        `;
        out.appendChild(foot);
        foot.scrollIntoView({ behavior: 'smooth' });
        return;
      }

      if (clean === 'help') {
        appendOutput('help', `доступные команды:
  - project     : подпроект mskmeetsgmd
  - qplate      : конструктор сайтов
  - qsak        : швейцарский нож для всех форматов
  - blog        : личный блог
  - about       : обо мне
  - stack       : стек и кодинг
  - telegram    : каналы и проекты
  - accounts    : соцсети и контакты
  - setup       : девайсы и сетап
  - games       : любимые игры
  - traits      : черты и характер
  - dni         : ограничения
  - clear       : очистить экран
  - all         : раскрыть всё био целиком`);
        return;
      }

      // Секретные пасхалки
      if (clean === 'coffee') {
        appendOutput('coffee', `
      (  )   (   )  )
       ) (   )  (  (
       ( )  (    ) )
       _____________
      <_____________> ===[ песочный латте готов ]===
       |           |/
       |   cafe    |
       |___________|
        `);
        return;
      }

      if (clean === 'cat') {
        appendOutput('cat', `
   /\\_/\\  
  ( o.o )  мяу. продолжай вайбкодить.
   > ^ <
        `);
        return;
      }

      if (clean === 'matrix') {
        appendOutput('matrix', 'wake up, sasha... follow the white rabbit.');
        return;
      }

      if (clean === 'sudo') {
        appendOutput('sudo', 'permission denied: вы не в файле sudoers. этот инцидент будет передан Санте.');
        return;
      }

      const secHtml = getSectionHtml(clean);
      if (secHtml) {
        const div = document.createElement('div');
        div.className = 'line';
        div.innerHTML = secHtml;
        out.appendChild(div);
        div.scrollIntoView({ behavior: 'smooth' });
        return;
      }

      appendOutput(clean, `shell: команда не найдена: ${clean}. введи "help" для списка.`);
    }

    function appendOutput(cmd, text) {
      const out = document.getElementById('dynamic-output');
      const div = document.createElement('div');
      div.className = 'line';
      div.innerHTML = `
        <div class="prompt-row">
          <span class="prompt"><span class="p-user">qualbyy</span><span class="p-sym">:</span><span class="p-path">~</span><span class="p-sym">$</span></span>
          <span class="command">${cmd}</span>
        </div>
        <div class="output" style="white-space: pre-wrap;">${text}</div>
      `;
      out.appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
    }

    document.getElementById('cli').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        runCmd(e.target.value);
        e.target.value = '';
      }
    });

    // Инициализация
    window.addEventListener('DOMContentLoaded', () => {
      renderFetch();
      appendOutput('system', 'введи "all" или кликай по кнопкам выше, чтобы открыть разделы. введи "help" для списка.');
      
      // Вычисляем точный геометрический центр экрана после отрисовки DOM
      requestAnimationFrame(() => {
        centerWindow('term');
        centerWindow('blog');
        const blogEl = document.getElementById('win-blog');
        blogEl.style.left = (parseInt(blogEl.style.left || 0) + 30) + 'px';
        blogEl.style.top = (parseInt(blogEl.style.top || 0) + 30) + 'px';
      });
    });
  </script>
</body>
</html>
